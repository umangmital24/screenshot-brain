name: Android Dev Build

on:
  push:
    branches:
      - feature/android-app
    paths:
      - 'android_app/**'
      - '.github/workflows/android-dev-build.yml'
  workflow_dispatch:

jobs:
  build-android-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android_app
    env:
      EXPO_PUBLIC_API_BASE: https://screenshot-brain-1.onrender.com
      EXPO_PUBLIC_SUPABASE_URL: https://yekvlxbxdtksexnhilan.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_E6wBZ-N1SQ3a7a9uTXBNpg_VCA82853
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android_app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Verify required runtime config
        run: |
          test -n "$EXPO_PUBLIC_API_BASE"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"

      - name: Build development APK
        run: ./android/gradlew -p android assembleDebug --no-daemon --stacktrace

      - name: Upload development APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samhaal-dev-apk
          path: android_app/android/app/build/outputs/apk/debug/app-debug.apk
