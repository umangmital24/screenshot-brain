name: Android Standalone Build

on:
  push:
    branches:
      - feature/android-app
    paths:
      - 'android_app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android_app
    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE: https://screenshot-brain-1.onrender.com
      EXPO_PUBLIC_SUPABASE_URL: https://yekvlxbxdtksexnhilan.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_E6wBZ-N1SQ3a7a9uTXBNpg_VCA82853
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '295083436259-48boa1abgmoq9jla0nr58rhmh6v06if0.apps.googleusercontent.com' }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android_app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Ensure Hermes compiler is executable
        run: |
          HERMES_BIN="node_modules/hermes-compiler/hermesc/linux64-bin/hermesc"
          test -f "$HERMES_BIN"
          chmod +x "$HERMES_BIN"
          test -x "$HERMES_BIN"

      - name: Expo config sanity check
        run: npx expo config --type public >/tmp/expo-config.json

      - name: Verify required public runtime config
        run: |
          test -n "$EXPO_PUBLIC_API_BASE"
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID"
          echo "$EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" | grep -Eq '^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$' || (echo "GOOGLE_WEB_CLIENT_ID must be a Web OAuth client ID" && exit 1)

      - name: Gradle compile + standalone test APK
        run: ./android/gradlew -p android assembleRelease -x lintVitalAnalyzeRelease --no-daemon --stacktrace

      - name: Upload standalone test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: samhaal-standalone-test-apk
          path: android_app/android/app/build/outputs/apk/release/app-release.apk
