name: Backend CI

on:
  push:
    branches:
      - backend-web-launch-hardening
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
